<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip-book</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header class ="header">
      <a href ="#" class = "logo">Flip-book</a>
      <nav class ="navbar">
        <a href ="#home">Home</a>
        <a href ="#Notes">Notes</a> 
        <a href ="#AIAssistant">AI-Assistant</a>
      </nav>
    </header>
    
<section class="home" id="home">
    <div class="layout" id="container">
    <section class="book">
        <div class="toolbar">
            <button id="prev-page">Previous</button>
            <button id="highlighter-toggle" onclick="toggleHighlighter()"> Highlighter Mode</button>
            <button id="next-page">Next</button>
        </div>
            <label for="notes-text">Notes</label>
            <textarea id="notes-text" placeholder="type here"></textarea>
        </div>
    </section>
    <section class="ai-area">
        <h3>AI Assistant</h3>
        <div id="chat-window"></div>
        <input type="text" placeholder="Ask AI...">
    </section>
</div>
</section>
</body>
</html>
